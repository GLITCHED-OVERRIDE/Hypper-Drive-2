<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Loader</title>
<style>
  body { margin:0; padding:0; background:#000; color:#fff; font-family:sans-serif; }
  iframe { width: 100%; height: 100%; border: none; display:block; }
</style>
</head>
<body>
<iframe id="gameFrame"></iframe>

<script>
const zipMapping = {
  "Crossy Road": "https://cdn.jsdelivr.net/gh/GLITCHED-OVERRIDE/Hypper-Drive-2@main/Games/Files/Source/Moblie/Crossy%20Road/file.zip"
};

async function loadGameFromZip(gameName) {
  try {
    // 1. Map the zip URL to a server-extracted path
    const basePath = `/Game/${encodeURIComponent(gameName)}/`;

    // 2. Attempt to fetch the main HTML
    const indexUrl = basePath + "index.html";
    const res = await fetch(indexUrl);
    if (!res.ok) throw new Error("Game HTML not found. Make sure the zip is extracted to " + basePath);

    // 3. Load the HTML in an iframe
    document.getElementById("gameFrame").src = indexUrl;
  } catch (err) {
    document.body.innerHTML = `<h1 style="color:#fff;">Failed to load game: ${gameName}</h1>`;
    console.error(err);
  }
}

// Determine game from URL path: /Game/[gameName]
const parts = window.location.pathname.split("/").filter(Boolean);
if (parts.length === 2 && parts[0].toLowerCase() === "game") {
  const gameName = decodeURIComponent(parts[1]);

  if (zipMapping[gameName]) {
    // The zip URL is known — instruct user to extract it to /Game/[gameName] manually
    loadGameFromZip(gameName);
  } else {
    document.body.innerHTML = `<h1 style="color:#fff;">Game not found in mapping</h1>`;
  }
} else {
  document.body.innerHTML = `<h1 style="color:#fff;">404 – Game not found</h1>`;
}
</script>
</body>
</html>
