<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glitch's Zip Runner</title>
<style>
  body, html { margin: 0; height: 100%; overflow: hidden; background: black; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<iframe id="zipFrame"></iframe>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(async () => {
    if (!('serviceWorker' in navigator)) {
        alert('Service Workers are required.');
        return;
    }

    // 1. Fetch the zip file
    const zipUrl = 'https://cdn.jsdelivr.net/gh/GLITCHED-OVERRIDE/Hypper-Drive-2@main/Games/Files/Source/Moblie/Crossy%20Road/file.zip'; // Hardcoded zip path on the same origin
    const response = await fetch(zipUrl);
    const blob = await response.blob();
    const zip = await JSZip.loadAsync(blob);

    // 2. Build file map under /Game/
    const fileMap = {};
    await Promise.all(Object.keys(zip.files).map(async path => {
        const file = zip.files[path];
        if (!file.dir) {
            const data = await file.async('arraybuffer');
            fileMap['/Game/' + path] = data; // all files start with /Game/
        }
    }));

    // 3. Register the service worker (must exist on same origin)
    await navigator.serviceWorker.register('/Glitch's.sw.js');
    await navigator.serviceWorker.ready;

    // 4. Send files to service worker
    if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'INIT', files: fileMap });

        // 5. Load /Game/index.html in iframe
        document.getElementById('zipFrame').src = '/Game/index.html';
    } else {
        console.error('Service worker is not controlling the page yet.');
    }
})();
</script>

</body>
</html>
