<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hypper-Drive-2 | Call of Duty: Roads to Victory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  font-family: monospace;
  color: #fff;
  overflow: hidden;
}

#game {
  position: absolute;
  inset: 0;
}

/* Loading screen */
#loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 999;
}

#logo {
  width: 180px;
  margin-bottom: 20px;
}

#progress {
  margin-top: 10px;
  font-size: 14px;
}

/* 🔴 Overlay — hidden until EmulatorJS loads */
#portedBy {
  position: fixed;
  top: 10px;
  right: 10px;
  padding: 6px 10px;
  background: rgba(0, 0, 0, 0.75);
  border: 1px solid #fff;
  font-size: 12px;
  letter-spacing: 0.5px;
  z-index: 1000;
  pointer-events: none;
  user-select: none;
  display: none;
}
</style>
</head>

<body>

<div id="game"></div>

<!-- Overlay -->
<div id="portedBy">Ported By Glitch</div>

<div id="loading">
  <img id="logo" src="https://raw.githubusercontent.com/GLITCHED-OVERRIDE/Hypper-Drive-2/main/H.D.2.png">
  <div>Call of Duty: Roads to Victory…</div>
  <div id="progress">0%</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
const partUrls = (() => {
  const base =
    "https://raw.githack.com/GLITCHED-OVERRIDE/Hypper-Drive-2/refs/heads/main/Games/Files/Source/PSP/Call of Duty: Roads to Victory/Source/Call of Duty - Roads to Victory (USA) (En,Ja,Fr,De,Es,It).zip";
  const parts = [];
  for (let i = 1; i <= 20; i++) {
    parts.push(base + "." + String(i).padStart(3, "0"));
  }
  return parts;
})();

const progress = document.getElementById("progress");

async function fetchAndMerge(urls) {
  const chunks = [];
  for (let i = 0; i < urls.length; i++) {
    const res = await fetch(urls[i]);
    if (!res.ok) throw new Error("Failed to fetch part " + (i + 1));
    chunks.push(new Uint8Array(await res.arrayBuffer()));
    progress.textContent =
      Math.floor((i + 1) / urls.length * 50) + "% (downloading)";
  }

  const size = chunks.reduce((s, c) => s + c.length, 0);
  const merged = new Uint8Array(size);
  let offset = 0;
  for (const c of chunks) {
    merged.set(c, offset);
    offset += c.length;
  }
  return merged;
}

(async () => {
  try {
    // Download ZIP
    const zipData = await fetchAndMerge(partUrls);

    // Extract ZIP
    progress.textContent = "60% (extracting)";
    const zip = await JSZip.loadAsync(zipData);

    let isoEntry = null;
    zip.forEach((name, file) => {
      if (
        name.toLowerCase().endsWith(".iso") ||
        name.toLowerCase().endsWith(".cso")
      ) {
        isoEntry = file;
      }
    });

    if (!isoEntry) throw new Error("ISO not found in ZIP");

    progress.textContent = "80% (preparing ISO)";
    const isoBlob = await isoEntry.async("blob");
    const isoUrl = URL.createObjectURL(isoBlob);

    // EmulatorJS config
    window.EJS_player = "#game";
    window.EJS_core = "psp";
    window.EJS_gameName = "Call of Duty: Roads to Victory";
    window.EJS_gameUrl = isoUrl;
    window.EJS_pathtodata =
      "https://cdn.jsdelivr.net/gh/GLITCHED-OVERRIDE/Hypper-Drive-2@main/Emulators/EMULATORJS/";
    window.EJS_threads = true;
    window.EJS_startOnLoaded = true;

    // Load EmulatorJS
    const script = document.createElement("script");
    script.src =
      "https://cdn.jsdelivr.net/gh/GLITCHED-OVERRIDE/Hypper-Drive-2@main/Emulators/EMULATORJS/loader.js";

    script.onload = () => {
      document.getElementById("loading").remove();
      document.getElementById("portedBy").style.display = "block";
    };

    document.body.appendChild(script);

  } catch (err) {
    progress.textContent = "Error: " + err.message;
    console.error(err);
  }
})();
</script>

</body>
</html>
