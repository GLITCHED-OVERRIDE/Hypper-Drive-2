<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hypper Drive 2 | PSP Loader</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: monospace;
  overflow: hidden;
}
#game { position: absolute; inset: 0; }
#loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
#progress {
  margin-top: 12px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
  <h2>Loading God of War: Ghost of Sparta…</h2>
  <div id="progress">0%</div>
</div>

<!-- JSZip -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
const partUrls = (() => {
  const base =
    "https://github.com/GLITCHED-OVERRIDE/Hypper-Drive-2/raw/refs/heads/main/Games/Files/Source/PSP/God of War: Ghost of Sparta/Source/God of War - Ghost of Sparta.zip";
  const parts = [];
  for (let i = 1; i <= 44; i++) {
    parts.push(base + "." + String(i).padStart(3, "0"));
  }
  return parts;
})();

const progressText = document.getElementById("progress");

async function fetchParts(urls) {
  const buffers = [];
  for (let i = 0; i < urls.length; i++) {
    const res = await fetch(urls[i]);
    if (!res.ok) throw new Error("Failed part " + (i + 1));
    buffers.push(new Uint8Array(await res.arrayBuffer()));
    progressText.textContent =
      Math.floor(((i + 1) / urls.length) * 50) + "% (downloading)";
  }

  const size = buffers.reduce((s, b) => s + b.length, 0);
  const merged = new Uint8Array(size);
  let offset = 0;
  for (const b of buffers) {
    merged.set(b, offset);
    offset += b.length;
  }
  return merged;
}

(async () => {
  try {
    // 1️⃣ Download ZIP
    const zipData = await fetchParts(partUrls);

    // 2️⃣ Unzip
    progressText.textContent = "60% (extracting)";
    const zip = await JSZip.loadAsync(zipData);

    // 3️⃣ Find ISO
    let isoFile = null;
    zip.forEach((name, file) => {
      if (name.toLowerCase().endsWith(".iso") || name.toLowerCase().endsWith(".cso")) {
        isoFile = file;
      }
    });

    if (!isoFile) throw new Error("No ISO found inside ZIP");

    // 4️⃣ Extract ISO
    progressText.textContent = "80% (preparing ISO)";
    const isoBlob = await isoFile.async("blob");
    const isoUrl = URL.createObjectURL(isoBlob);

    // 5️⃣ Start EmulatorJS
    window.EJS_player = "#game";
    window.EJS_core = "psp";
    window.EJS_gameName = "God of War: Ghost of Sparta";
    window.EJS_gameUrl = isoUrl;
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = true;
    window.EJS_threads = true;

    const script = document.createElement("script");
    script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
    script.onload = () => document.getElementById("loading").remove();
    document.body.appendChild(script);

  } catch (e) {
    progressText.textContent = "Error: " + e.message;
    console.error(e);
  }
})();
</script>

</body>
</html>
